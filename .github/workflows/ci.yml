name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: "file:./ci.db"
  NEXTAUTH_SECRET: "ci-secret-not-for-production"
  NEXTAUTH_URL: "http://localhost:3000"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  ANTHROPIC_API_KEY: "sk-ant-ci-placeholder"
  STRIPE_SECRET_KEY: "sk_test_ci_placeholder"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Vérifier les types (tsc)
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Build de production
        run: npm run build
